name: Turing jobs watcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turing-jobs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check for new jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          POLL_MINUTES: "0"
        run: python turing_jobs_bot.py

      - name: Save seen jobs
        run: |
          if [ -n "$(git status --porcelain seen_jobs.json)" ]; then
            git config user.name "jobs-bot"
            git config user.email "jobs-bot@users.noreply.github.com"
            git add seen_jobs.json
            git commit -m "Update seen jobs"
            git push
          fi
